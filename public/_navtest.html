<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ed">
  <meta name="robots" content="noindex,nofollow">
  <title>DuoPlan — наше пространство</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script>
  (() => {
    const dark = new URLSearchParams(location.search).has("dark");
    window.Telegram = { WebApp: {
      initData: "test-init-data",
      colorScheme: dark ? "dark" : "light",
      ready(){}, expand(){}, disableVerticalSwipes(){}, setHeaderColor(){}, setBackgroundColor(){},
      onEvent(){}, close(){}, reload(){},
      BackButton: { show(){}, hide(){}, onClick(){} },
      HapticFeedback: { impactOccurred(){} }
    }};
    window.__state = {
      user: { display_name: "Аня", points: 120, streak: 4 },
      pair: { name1: "Аня", name2: "Серёжа", user_b: 1, code: "A1B2C3D4", together_pts: 340, started_at: "2026-02-14" },
      tasks: [
        { id: 1, title: "Выбрать место для поездки", created_at: 1761600000, day: "2026-11-02", time: "19:30" },
        { id: 2, title: "Приготовить ужин вместе", created_at: 1761500000, day: null, time: null }
      ],
      completedTasks: [],
      dates: [
        { id: 1, title: "Наша первая встреча", day: "2026-12-12", time: null, recurs: 1 },
        { id: 2, title: "Годовщина", day: "2027-02-14", time: null, recurs: 1 }
      ],
      memories: [{ id: 1, body: "Гуляли по набережной и долго говорили о лете.", day: "2026-10-20", display_name: "Серёжа" }],
      wishes: [{ id: 1, body: "Провести выходной у моря", display_name: "Аня" }],
      completedWishes: [],
      daily: { action: "Обнять друг друга на 20 секунд", done: false }
    };
    window.fetch = async () => new Response(JSON.stringify(window.__state), { status: 200, headers: { "content-type": "application/json" } });
  })();
  </script>
  <script src="/app.js" defer></script>
</head>
<body>
  <noscript><p class="noscript">Для DuoPlan нужен JavaScript. Откройте <a href="https://t.me/duoplanbot">@duoplanbot</a> в Telegram.</p></noscript>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-copy"><button class="back-button topbar-back" id="topbar-back" data-route="home" aria-label="Назад на главную" hidden>←</button><h1 id="page-title" tabindex="-1">НАШЕ ПРОСТРАНСТВО</h1></div>
      <button class="avatar-button" data-route="pair" aria-label="Наша пара"><span id="avatar-letter">Д</span></button>
    </header>

    <main id="content" class="content"></main>

    <nav class="bottom-nav" aria-label="Основные разделы">
      <span class="nav-drop" aria-hidden="true"></span>
      <button class="nav-item active" data-route="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Главная</span></button>
      <button class="nav-item" data-route="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 4 4L19 6"/><path d="M21 12a9 9 0 1 1-5-8"/></svg><span>Планы</span></button>
      <button class="nav-item" data-route="wishes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg><span>Желания</span></button>
      <button class="nav-item" data-route="memories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span>Дневник</span></button>
      <button class="nav-item" data-route="dates"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/></svg><span>Даты</span></button>
    </nav>
  </div>

  <section id="onboarding" class="onboarding" hidden>
    <div class="onboarding-art" aria-hidden="true"><span></span><span></span></div>
    <p class="overline">DuoPlan</p><h1>Ваше общее<br>пространство</h1>
    <p>Создайте место только для вас двоих или войдите по приглашению партнёра. Эти записи видите только вы.</p>
    <button class="primary full" data-action="create-pair">Создать пространство</button>
    <button class="secondary full" data-action="show-join">У меня есть код</button>
  </section>

  <section id="outside" class="outside">
    <div class="loader-mark" aria-hidden="true"></div><h1>Открываем DuoPlan…</h1><p>Подготавливаем ваше пространство.</p>
  </section>

  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <form id="dialog-form">
      <div class="dialog-handle" aria-hidden="true"></div>
      <h2 id="dialog-title"></h2>
      <p id="dialog-description"></p>
      <div id="dialog-fields"></div>
      <p id="dialog-error" class="form-error" role="alert" tabindex="-1" hidden></p>
      <div class="dialog-actions"><button type="button" class="secondary" data-action="close-dialog">Отмена</button><button type="submit" class="primary">Сохранить</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
