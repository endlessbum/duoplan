<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Настройка DuoPlan</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box;background:#f7f3ed;color:#292524;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(440px,100%);padding:32px;border:1px solid #e9e1d9;border-radius:24px;background:#fffdf9;box-shadow:0 20px 60px #4b362e12}h1{margin:0 0 10px;font:32px Georgia,serif}p{color:#746d68;line-height:1.55}label{display:block;margin:22px 0 7px;font-size:13px;font-weight:650}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #e9e1d9;border-radius:12px;background:#f7f3ed;font:inherit}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:#b85464;color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#result{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}</style></head>
<body><main class="card"><h1>Активация DuoPlan</h1><p>Введите секрет webhook, который сохранён в переменных Cloudflare Worker. Он используется только для этого запроса и нигде не сохраняется.</p><form id="setup"><label for="secret">WEBHOOK_SECRET</label><input id="secret" type="password" autocomplete="off" required><button type="submit">Создать таблицы и включить webhook</button></form><p id="result" role="status"></p></main><script>document.querySelector('#setup').addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button');const result=document.querySelector('#result');button.disabled=true;result.textContent='Настраиваем…';try{const response=await fetch('/setup',{method:'POST',headers:{authorization:'Bearer '+document.querySelector('#secret').value}});const data=await response.json();if(!response.ok)throw new Error(data.error||'Ошибка настройки');result.textContent='Готово. База создана, webhook и кнопка Mini App активированы.\n\nТеперь откройте @duoplanbot в Telegram.';event.target.hidden=true;}catch(error){result.textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
