<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ed">
  <title>DuoPlan — Наше пространство</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css?v=2026.10.30.16">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- Парящие стеклянные кнопки вверху окна в стиле Telegram -->
    <div class="top-glass-bar" role="region" aria-label="Быстрые действия">
      <div class="top-glass-left">
        <button id="fullscreen-close" class="glass-btn glass-icon-btn" type="button" aria-label="Закрыть приложение">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
            <path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>
          </svg>
        </button>
      </div>
      <div class="top-glass-right">
        <button id="homescreen-button" class="glass-btn glass-icon-btn" type="button" aria-label="Добавить на главный экран" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 3.5h6"/>
            <path d="M10 3.5v5.2L6.8 12.6c-.4.8.2 1.7 1.1 1.7h8.2c.9 0 1.5-.9 1.1-1.7L14 8.7V3.5"/>
            <path d="M12 14.5v6.2"/>
          </svg>
        </button>
        <button id="pair-button" class="glass-btn pair-pill" type="button" aria-label="Наша пара">
          <span class="pair-avatars" aria-hidden="true">
            <span id="avatar-a" class="mini-avatar">Д</span>
            <span id="avatar-b" class="mini-avatar is-second">П</span>
          </span>
        </button>
      </div>
    </div>

    <!-- Основной контент вкладки (шапка внедрена прямо внутрь вкладки над элементами) -->
    <main id="app" class="main-view" aria-live="polite">
      <div class="loading-card">
        <div class="spinner" aria-hidden="true"></div>
        <p>Открываем ваше пространство…</p>
      </div>
    </main>

    <!-- Нижний стеклянный бар с жидкой каплей в стиле Telegram iOS.
         Капля — SVG-путь: контур пересчитывается по скорости и направлению
         жеста (public/nav.js), поэтому она деформируется, а не просто едет. -->
    <nav id="bottom-nav" class="bottom-nav" aria-label="Разделы пространства" hidden>
      <svg id="nav-droplet" class="nav-droplet" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="nav-drop-fill" x1="0" y1="0" x2="0" y2="1">
            <stop class="nav-drop-stop-top" offset="0" />
            <stop class="nav-drop-stop-mid" offset="0.62" />
            <stop class="nav-drop-stop-bottom" offset="1" />
          </linearGradient>
        </defs>
        <path id="nav-droplet-path" class="nav-droplet-path" d="" />
      </svg>

      <button class="nav-item is-active" type="button" data-tab="home" aria-current="page">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20.5s-7.5-4.35-7.5-10.3a4.3 4.3 0 0 1 7.5-2.85 4.3 4.3 0 0 1 7.5 2.85c0 5.95-7.5 10.3-7.5 10.3Z"/>
          </svg>
        </span>
        <span class="nav-label">Главная</span>
      </button>

      <button class="nav-item" type="button" data-tab="tasks">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 12.5 3.8 3.8L18.5 7.6"/>
            <rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/>
          </svg>
        </span>
        <span class="nav-label">Планы</span>
      </button>

      <button class="nav-item" type="button" data-tab="dates">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/>
            <path d="M8 3v3.5M16 3v3.5M3.5 9.5h17"/>
          </svg>
        </span>
        <span class="nav-label">Даты</span>
      </button>

      <button class="nav-item" type="button" data-tab="memories">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 19.5A2.5 2.5 0 0 1 7.5 17H19V4H7.5A2.5 2.5 0 0 0 5 6.5v13Z"/>
            <path d="M5 19.5A2.5 2.5 0 0 0 7.5 22H19v-5"/>
          </svg>
        </span>
        <span class="nav-label">Дневник</span>
      </button>

      <button class="nav-item" type="button" data-tab="wishes">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3.4 2.55 5.18 5.72.83-4.14 4.03.98 5.7L12 16.45l-5.11 2.69.98-5.7-4.14-4.03 5.72-.83L12 3.4Z"/>
          </svg>
        </span>
        <span class="nav-label">Желания</span>
      </button>
    </nav>
  </div>

  <!-- Модальное окно создания/редактирования -->
  <dialog id="item-dialog" class="sheet-dialog">
    <form id="item-form" method="dialog" class="sheet-form">
      <div class="sheet-head">
        <h2 id="dialog-title">Новая запись</h2>
        <button type="button" class="icon-close" data-action="close-dialog" aria-label="Закрыть">✕</button>
      </div>
      <div id="dialog-fields" class="sheet-fields"></div>
      <div class="sheet-actions">
        <button type="button" id="dialog-cancel" class="secondary" data-action="close-dialog">Отмена</button>
        <button type="submit" id="dialog-submit" class="primary">Сохранить</button>
      </div>
    </form>
    <!-- Меню форматирования выделенного текста (в стиле Telegram). Живёт внутри
         dialog: showModal выводит диалог в top-layer, fixed-элементы снаружи
         оказались бы под ним. -->
    <div id="fmt-toolbar" class="fmt-toolbar" hidden>
      <button type="button" data-fmt="**" aria-label="Жирный"><b>Ж</b></button>
      <button type="button" data-fmt="_" aria-label="Курсив"><i>К</i></button>
      <button type="button" data-fmt="__" aria-label="Подчёркнутый"><u>Ч</u></button>
      <button type="button" data-fmt="~~" aria-label="Зачёркнутый"><s>S</s></button>
      <button type="button" data-fmt="||" aria-label="Скрытый текст"><span class="fmt-spoiler-dot"></span></button>
      <button type="button" data-fmt=">" aria-label="Цитата">❝</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/zoom-guard.js?v=2026.10.30.16" defer></script>
  <script src="/nav.js?v=2026.10.30.16" defer></script>
  <script src="/app.js?v=2026.10.30.16" defer></script>
</body>
</html>
