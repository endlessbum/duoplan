<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ed">
  <title>DuoPlan — наше пространство</title>
  <link rel="stylesheet" href="/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div><span class="overline">НАШЕ ПРОСТРАНСТВО</span><h1 id="pair-name">DuoPlan</h1></div>
      <button class="avatar-button" data-route="pair" aria-label="Наша пара"><span id="avatar-letter">Д</span></button>
    </header>

    <main id="content" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Основные разделы">
      <button class="nav-item active" data-route="home"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Главная</span></button>
      <button class="nav-item" data-route="tasks"><svg viewBox="0 0 24 24"><path d="m4 12 4 4L19 6"/><path d="M21 12a9 9 0 1 1-5-8"/></svg><span>Планы</span></button>
      <button class="nav-item add-button" data-action="quick-add" aria-label="Добавить"><span>+</span></button>
      <button class="nav-item" data-route="memories"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span>Дневник</span></button>
      <button class="nav-item" data-route="dates"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/></svg><span>Даты</span></button>
    </nav>
  </div>

  <section id="onboarding" class="onboarding" hidden>
    <div class="onboarding-art"><span></span><span></span></div>
    <p class="overline">DuoPlan</p><h1>Ваше общее<br>пространство</h1>
    <p>Создайте место только для вас двоих или войдите по приглашению партнёра.</p>
    <button class="primary full" data-action="create-pair">Создать пространство</button>
    <button class="secondary full" data-action="show-join">У меня есть код</button>
  </section>

  <section id="outside" class="outside">
    <div class="loader-mark"></div><h1>Открываем DuoPlan…</h1><p>Подготавливаем ваше пространство.</p>
  </section>

  <dialog id="dialog" class="dialog"><form id="dialog-form"><div class="dialog-handle"></div><h2 id="dialog-title"></h2><p id="dialog-description"></p><div id="dialog-fields"></div><div class="dialog-actions"><button type="button" class="secondary" data-action="close-dialog">Отмена</button><button type="submit" class="primary">Сохранить</button></div></form></dialog>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
