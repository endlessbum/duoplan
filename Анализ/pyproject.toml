[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "duoplan-bot"
dynamic = ["version"]
description = "DuoPlan — приложение для пар: общие планы, значимые даты, общий дневник и вишлисты."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.31,<4",
    "aiosqlite>=0.20,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pillow>=10"]

[project.scripts]
duoplan = "duoplan.__main__:run"

[tool.setuptools.dynamic]
version = {attr = "duoplan.__version__"}

[tool.setuptools.packages.find]
include = ["duoplan*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
